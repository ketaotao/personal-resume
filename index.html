<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이력서">
  <meta name="theme-color" content="#ffffff">
  <title>이력서</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #122746;
      --muted: #425674;
      --line: #d8e4f1;
      --accent: #204f87;
      --sans: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      --serif: "Noto Serif KR", Batang, "AppleMyungjo", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.7 var(--sans); }
    h1, h2, h3, p, figure { margin: 0; word-break: keep-all; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .3em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .sheet { width: min(60rem, calc(100% - 5rem)); margin-inline: auto; }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem 2rem;
      flex-wrap: wrap;
      min-height: 4.6rem;
      padding-block: .8rem;
      border-bottom: 1px solid var(--line);
      font-size: .875rem;
    }
    .brand { display: inline-flex; align-items: center; gap: .65rem; font-weight: 700; }
    .brand::before { content: ""; width: 1.15rem; height: 2px; background: var(--accent); }
    .navigation { display: flex; gap: .5rem clamp(1rem, 3vw, 2rem); flex-wrap: wrap; color: var(--muted); }
    .navigation a { padding-block: .25rem; }

    .profile {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: clamp(1.2rem, 5vw, 4rem);
      align-items: end;
      padding-block: clamp(2.5rem, 7vw, 5.6rem) clamp(2rem, 5vw, 3.6rem);
      border-bottom: 2px solid var(--ink);
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(3rem, 8vw, 5.75rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }
    .role { margin-top: 1rem; color: var(--accent); font-size: clamp(.95rem, 2vw, 1.125rem); font-weight: 650; }
    .summary { max-width: 40ch; margin-top: .65rem; color: var(--muted); }
    .portrait {
      display: grid;
      place-items: center;
      width: clamp(7.25rem, 18vw, 10rem);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f0f5fb;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .08em;
    }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .resume-section {
      display: grid;
      grid-template-columns: minmax(8rem, .25fr) minmax(0, 1fr);
      gap: .65rem 2rem;
      padding-block: clamp(1.3rem, 3vw, 2rem);
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 1rem;
    }
    h2 { color: var(--accent); font-size: .875rem; font-weight: 700; letter-spacing: .065em; }
    h3 { font-size: 1.125rem; font-weight: 650; line-height: 1.45; }
    .details { margin-top: .35rem; color: var(--muted); font-size: .9375rem; }
    .entry-heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .25rem 1.3rem; }
    .period { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
    .inline-list { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin: 0; padding: 0; list-style: none; }
    .inline-list li + li { padding-inline-start: .9rem; border-inline-start: 1px solid var(--line); }
    .resume-section a { overflow-wrap: anywhere; }
    .site-footer { display: flex; justify-content: flex-end; padding-block: 1.1rem 2.25rem; color: var(--muted); font-size: .8125rem; }

    @media (max-width: 620px) {
      .sheet { width: calc(100% - 2.5rem); }
      .masthead { min-height: 3.75rem; }
      .profile { align-items: start; }
      h1 { font-size: clamp(2.125rem, 10vw, 3.9rem); }
      .portrait { width: clamp(4.75rem, 22vw, 7.25rem); }
      .resume-section { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body id="top">
  <div class="sheet">
    <header class="masthead">
      <a class="brand" href="#top">이력서</a>
      <nav class="navigation" aria-label="이력서 메뉴">
        <a href="#education">학력</a>
        <a href="#projects">프로젝트</a>
        <a href="#skills">기술</a>
        <a href="#contact">연락처</a>
      </nav>
    </header>

    <main>
      <div class="profile">
        <div>
          <h1>이름</h1>
          <p class="role">전공 · 희망 직무</p>
          <p class="summary">관심 분야와 경험을 한 문장으로 소개합니다.</p>
        </div>
        <!-- 사진을 추가할 때 이 문구를 src와 alt가 있는 img 요소로 바꿉니다. -->
        <figure class="portrait"><span>프로필 사진</span></figure>
      </div>

      <section class="resume-section" id="education" aria-labelledby="education-title">
        <h2 id="education-title">학력</h2>
        <div>
          <div class="entry-heading">
            <h3>학교명</h3>
            <p class="period">재학 기간</p>
          </div>
          <p class="details">전공 · 학위</p>
        </div>
      </section>

      <section class="resume-section" id="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">프로젝트 경험</h2>
        <div>
          <h3>프로젝트명</h3>
          <p class="details">프로젝트 개요, 담당 역할 및 성과를 작성합니다.</p>
        </div>
      </section>

      <section class="resume-section" id="skills" aria-labelledby="skills-title">
        <h2 id="skills-title">보유 기술</h2>
        <ul class="inline-list" role="list">
          <li>프로그래밍 언어</li>
          <li>프레임워크 및 도구</li>
        </ul>
      </section>

      <section class="resume-section" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">연락처</h2>
        <ul class="inline-list" role="list">
          <li>이메일</li>
          <li>GitHub</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <a href="#top">맨 위로 ↑</a>
    </footer>
  </div>
</body>
</html>
