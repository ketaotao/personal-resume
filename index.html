<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人简历网站模板">
  <meta name="theme-color" content="#f7f8f6">
  <title>个人简历</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f8f6;
      --surface: #fff;
      --ink: #182726;
      --muted: #53625f;
      --line: #dce4df;
      --accent: #216151;
      --tint: #e8f0eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.65 Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .24em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    .shell { width: min(100% - 3rem, 56rem); margin-inline: auto; }
    .site-header { border-bottom: 1px solid var(--line); }
    .header-inner, .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header-inner { min-height: 4.5rem; padding-block: .85rem; }
    .brand { font-weight: 700; }
    .navigation { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; }
    .navigation a, .site-footer { color: var(--muted); font-size: .875rem; }
    main { padding-block: clamp(2.25rem, 7vw, 5rem) 2.75rem; }
    h1, h2, h3, p { margin: 0; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(1rem, 4vw, 3rem);
      padding: clamp(1.5rem, 5vw, 3.25rem);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
    }
    h1 { font-size: clamp(2.25rem, 7vw, 4rem); line-height: 1.12; letter-spacing: -.04em; }
    .role { margin-top: .65rem; color: var(--accent); font-weight: 650; }
    .hero p + p { margin-top: .65rem; color: var(--muted); }
    .portrait {
      display: grid;
      place-items: center;
      inline-size: clamp(5.25rem, 19vw, 9.5rem);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: var(--tint);
      border: 1px solid var(--line);
      border-radius: .85rem;
      color: var(--accent);
      font-size: .875rem;
    }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .resume-section {
      display: grid;
      grid-template-columns: 9rem minmax(0, 1fr);
      gap: .5rem 1.5rem;
      padding-block: 1.4rem;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 1rem;
    }
    .resume-section:first-of-type { margin-top: 2rem; }
    h2 { font-size: 1rem; color: var(--accent); }
    h3 { font-size: 1rem; font-weight: 650; }
    .details { margin-top: .2rem; color: var(--muted); font-size: .92rem; }
    .entry-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .15rem 1rem; }
    .entry-heading .details { margin-top: 0; }
    .skills { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
    .skills li { padding: .12rem .7rem; background: var(--tint); color: var(--accent); border-radius: .35rem; font-size: .875rem; }
    .site-footer { padding-bottom: 2rem; }

    @media (max-width: 540px) {
      .shell { width: calc(100% - 2rem); }
      .resume-section { grid-template-columns: 1fr; }
      .navigation { gap: .4rem .85rem; }
    }
    @media (max-width: 350px) {
      .hero { grid-template-columns: 1fr; }
      .portrait { grid-row: 1; }
    }
  </style>
</head>
<body id="top">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top">个人简历</a>
      <nav class="navigation" aria-label="简历目录">
        <a href="#education">教育</a>
        <a href="#projects">项目</a>
        <a href="#skills">技能</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <div class="hero">
      <div>
        <h1>你的姓名</h1>
        <p class="role">专业方向 / 目标岗位</p>
        <p>一句话介绍你的背景或关注的技术方向。</p>
      </div>
      <!-- 加照片时，将下方的 span 换成 img，并补上 src 与 alt。 -->
      <div class="portrait"><span>头像位置</span></div>
    </div>

    <section class="resume-section" id="education" aria-labelledby="education-title">
      <h2 id="education-title">教育经历</h2>
      <div>
        <div class="entry-heading">
          <h3>学校名称</h3>
          <p class="details">在读时间</p>
        </div>
        <p class="details">专业名称 · 学位</p>
      </div>
    </section>

    <section class="resume-section" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">项目经历</h2>
      <div>
        <h3>项目名称</h3>
        <p class="details">简述项目目标、你的职责与成果。</p>
      </div>
    </section>

    <section class="resume-section" id="skills" aria-labelledby="skills-title">
      <h2 id="skills-title">技能</h2>
      <ul class="skills">
        <li>编程语言</li>
        <li>框架与工具</li>
      </ul>
    </section>

    <section class="resume-section" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">联系方式</h2>
      <p class="details">电子邮箱 · GitHub</p>
    </section>
  </main>

  <footer class="shell site-footer">
    <a href="#top">返回顶部 ↑</a>
  </footer>
</body>
</html>
